name: COBECO MySQL
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: cobeco_test
          MYSQL_USER: cobeco
          MYSQL_PASSWORD: ci-test-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: COBECO
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: cobeco_test
      MYSQL_USER: cobeco
      MYSQL_PASSWORD: ci-test-password
      JWT_SECRET: ci-only-signing-secret-at-least-32-characters
      MYSQL_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: COBECO/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - run: node --test frontend/tests/*.test.mjs
      - run: python -m backend.export_openapi --check
      - run: docker build -t cobeco:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: COBECO/coverage.xml
