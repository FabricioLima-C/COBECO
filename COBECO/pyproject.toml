[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = ["mysql: integration tests requiring an isolated MySQL database"]

[tool.coverage.run]
source = ["backend.domain", "backend.usecases"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 110
include = ["backend/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
